<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="TRE BI">
<meta name="description" content="Programme de perfectionnement en grammaire anglaise (B1 vers B2+) : anglais technique des données, de la statistique et de Power BI, et traduction professionnelle français-anglais.">
<title>English for Data &amp; Translation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--surface:#ffffff;--surface2:#eef1f4;--ink:#17202a;--muted:#59646f;--line:#dfe4e9;--accent:#0f6e85;--accent-ink:#ffffff;--ok:#1d7a44;--ok-bg:#e5f4eb;--bad:#b3372e;--bad-bg:#fbe9e7;--trap:#9a5800;--trap-bg:#fff4df;--data:#3646a6;--data-bg:#eaedfb;--trad:#7a3ca5;--trad-bg:#f4ebfa;--tip:#0f6e85;--tip-bg:#e3f1f4;--shadow:0 1px 2px rgba(16,24,40,.05),0 2px 6px rgba(16,24,40,.06);--radius:12px;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--serif:"Source Serif 4",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--surface:#151c24;--surface2:#1c2630;--ink:#e5eaef;--muted:#9aa6b2;--line:#29343f;--accent:#4db4cc;--accent-ink:#081116;--ok:#5ccb8b;--ok-bg:#14301f;--bad:#f17d74;--bad-bg:#3a1c19;--trap:#f0b44c;--trap-bg:#32270e;--data:#97a5ff;--data-bg:#1c2243;--trad:#cb9df1;--trad-bg:#2a1d39;--tip:#4db4cc;--tip-bg:#122f38;--shadow:none}}
:root[data-theme="dark"]{--bg:#0e1319;--surface:#151c24;--surface2:#1c2630;--ink:#e5eaef;--muted:#9aa6b2;--line:#29343f;--accent:#4db4cc;--accent-ink:#081116;--ok:#5ccb8b;--ok-bg:#14301f;--bad:#f17d74;--bad-bg:#3a1c19;--trap:#f0b44c;--trap-bg:#32270e;--data:#97a5ff;--data-bg:#1c2243;--trad:#cb9df1;--trad-bg:#2a1d39;--tip:#4db4cc;--tip-bg:#122f38;--shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans)}
a{color:var(--accent)}
b,strong{font-weight:600}
code,.mono{font-family:var(--mono);font-size:.9em;background:var(--surface2);padding:1px 5px;border-radius:5px}
.topbar{position:sticky;top:0;z-index:40;height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;color:var(--ink);letter-spacing:-.01em;min-width:0}
.brand .logo{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-size:15px;font-weight:700}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.2}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-nav{margin-left:auto;display:flex;gap:2px}
.top-nav a{padding:6px 11px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
.top-nav a.on,.top-nav a:hover{background:var(--surface2);color:var(--ink)}
.icon-btn{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;width:38px;height:38px;cursor:pointer;font-size:16px;display:grid;place-items:center}
#menu{display:none}
.layout{display:grid;grid-template-columns:292px minmax(0,1fr)}
#sidebar{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;padding:14px 12px 48px;border-right:1px solid var(--line);background:var(--surface)}
.side-links{display:none}
.side-links a{display:block;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14px}
.side-links a.on{background:var(--surface2)}
.side-mod{margin-top:14px}
.side-mod-t{font-size:13px;font-weight:600;padding:3px 9px;border-left:3px solid var(--mc);margin-bottom:4px;line-height:1.35}
.side-mod-t span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mc);font-weight:700}
.side-ch{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.3}
.side-ch:hover{background:var(--surface2)}
.side-ch.on{background:var(--surface2);box-shadow:inset 3px 0 0 var(--mc)}
.side-ch .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.side-ch .t{flex:1}
.side-ch .sc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.side-ch.prog .dot{border-color:var(--mc)}
.side-ch.done .dot{background:var(--ok);border-color:var(--ok)}
main{padding:30px 34px 90px;max-width:940px;width:100%;min-width:0}
h1{font-family:var(--serif);font-size:34px;line-height:1.2;margin:.15em 0 .45em;letter-spacing:-.01em}
h2{font-size:21px;line-height:1.3;margin:1.7em 0 .6em;letter-spacing:-.01em}
h3{font-size:17px;line-height:1.35;margin:1.6em 0 .5em}
p{margin:.55em 0}
ul,ol{padding-left:1.3em}
li{margin:.25em 0}
.muted{color:var(--muted)}
.lead{font-size:18px;color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:18px 0;box-shadow:var(--shadow)}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 15px;font:500 14px/1.2 var(--sans);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.on{outline:2px solid var(--accent);outline-offset:1px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* hero */
.hero{padding:8px 0 4px}
.hero .kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:26px;font-family:var(--serif);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mod-card{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--mc);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.mod-card:hover{border-color:var(--mc)}
.mod-card .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mc)}
.mod-card h3{margin:.2em 0 .3em}
.mod-card ol{margin:.3em 0 0;font-size:14px;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding:4px 0 4px 40px;margin:8px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
/* tables */
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.g{border-collapse:collapse;width:100%;font-size:14.5px}
table.g th,table.g td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.g th{background:var(--surface2);font-weight:600;font-size:13px;letter-spacing:.01em}
table.g tr:last-child td{border-bottom:0}
table.g td:first-child{font-weight:500}
table.plan td:first-child{font-family:var(--mono);font-size:13px;white-space:nowrap}
table.plan tr.mrow td{background:var(--surface2);font-weight:700;color:var(--mc);font-family:var(--sans);font-size:13px;letter-spacing:.03em;text-transform:uppercase}
.st{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.st.done{background:var(--ok-bg);color:var(--ok)}
.st.prog{background:var(--tip-bg);color:var(--tip)}
/* chapter */
.ch-head{border-left:5px solid var(--mc);padding:4px 0 4px 18px;margin-bottom:12px}
.ch-meta{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mc)}
.ch-n{font-family:var(--mono);font-size:.62em;color:var(--mc);margin-right:12px;vertical-align:.25em}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tag{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.tag.d{background:var(--data-bg);border-color:transparent;color:var(--data)}
.tag.t{background:var(--trad-bg);border-color:transparent;color:var(--trad)}
.scorebar{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-top:10px}
.bar{flex:1;min-width:90px;max-width:340px;height:8px;border-radius:8px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mc,var(--accent));border-radius:8px;transition:width .3s}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:6px 22px 20px;box-shadow:var(--shadow);margin:18px 0}
.lesson>h2{margin-top:14px}
.lesson h3{color:var(--mc);border-bottom:1px solid var(--line);padding-bottom:4px}
.ex{border-left:3px solid var(--mc);background:var(--surface2);padding:7px 14px;margin:9px 0;border-radius:0 8px 8px 0}
.ex p{margin:2px 0}
.ex .en{font-weight:500}
.ex .en::before{content:"EN";font:700 10.5px var(--mono);color:var(--mc);margin-right:8px;vertical-align:1px}
.ex .fr{color:var(--muted);font-size:14.5px}
.ex .fr::before{content:"FR";font:700 10.5px var(--mono);color:var(--muted);margin-right:8px;vertical-align:1px}
s{color:var(--bad);text-decoration-thickness:2px}
.box{border-radius:10px;padding:12px 16px;margin:14px 0;border:1px solid transparent}
.box::before{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.box.trap{background:var(--trap-bg);border-color:color-mix(in srgb,var(--trap) 30%,transparent)}
.box.trap::before{content:"⚠ Piège du francophone";color:var(--trap)}
.box.data{background:var(--data-bg);border-color:color-mix(in srgb,var(--data) 25%,transparent)}
.box.data::before{content:"▦ Focus données";color:var(--data)}
.box.trad{background:var(--trad-bg);border-color:color-mix(in srgb,var(--trad) 25%,transparent)}
.box.trad::before{content:"⇄ Focus traduction";color:var(--trad)}
.box.tip{background:var(--tip-bg);border-color:color-mix(in srgb,var(--tip) 25%,transparent)}
.box.tip::before{content:"✓ À retenir";color:var(--tip)}
.box p:first-of-type{margin-top:0}.box p:last-child{margin-bottom:0}
.box ul{margin:.3em 0}
/* exercises */
.exo{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin:16px 0;box-shadow:var(--shadow)}
.exo-h{display:flex;gap:10px;align-items:center}
.exo-n{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mc)}
.exo-k{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted)}
.exo h3{margin:.35em 0 .2em;border:0;color:var(--ink)}
.instr{color:var(--muted);font-size:14.5px}
.items{padding-left:1.4em}
.items>li{padding:10px 0;border-bottom:1px dashed var(--line);margin:0}
.items>li:last-child{border-bottom:0}
.it .q{line-height:2}
input.gap{font:500 15px var(--sans);color:var(--ink);background:var(--surface2);border:0;border-bottom:2px solid var(--muted);border-radius:6px 6px 0 0;padding:3px 8px;margin:0 4px;width:170px;max-width:100%}
.it.ok input.gap{border-color:var(--ok);background:var(--ok-bg)}
.it.bad input.gap{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:14px;margin-top:4px}
.fb:empty{display:none}
.good{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
.sol{font-size:14px;background:var(--surface2);border-radius:8px;padding:8px 12px;margin-top:6px}
.sol .model{font-weight:500;color:var(--ink)}
.sol .note{color:var(--muted);margin-top:4px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 12px;font:15px/1.4 var(--sans);cursor:pointer}
.opt:hover{background:var(--surface2)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.dir{display:inline-block;font:700 11px var(--mono);padding:2px 7px;border-radius:5px;background:var(--trad-bg);color:var(--trad);margin-right:6px;vertical-align:2px}
textarea{width:100%;font:15px/1.5 var(--sans);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:8px 0;resize:vertical}
.self{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.exo-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ch-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.pn{margin-left:auto;display:flex;gap:8px}
/* progress */
.prow{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) 92px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow:last-child{border-bottom:0}
.prow a{text-decoration:none;color:var(--ink)}
.prow .bar{max-width:none;height:10px}
.prow .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input[type=date],input[type=search]{font:15px var(--sans);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
input[type=search]{width:100%;margin:10px 0}
.notice{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 14px}
footer.site{margin-top:60px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
#scrim{display:none}
@media (max-width:960px){
 .layout{grid-template-columns:1fr}
 #sidebar{position:fixed;left:0;top:58px;width:300px;max-width:86vw;transform:translateX(-102%);transition:transform .2s ease;z-index:35;height:calc(100vh - 58px)}
 body.nav-open #sidebar{transform:none}
 body.nav-open #scrim{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.35);z-index:30}
 #menu{display:grid}
 .top-nav{display:none}
 .side-links{display:block}
 main{padding:22px 16px 70px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .mods{grid-template-columns:1fr}
 h1{font-size:28px}
 .prow{grid-template-columns:1fr 70px}
 .prow .bar{grid-column:1/-1;grid-row:2}
 .pn{margin-left:0}
 .lesson{padding:4px 14px 16px}
 .exo{padding:14px}
}
@media print{.topbar,#sidebar,.exo-actions,.ch-foot,textarea{display:none!important}.layout{display:block}main{padding:0;max-width:none}.sol{display:block!important}}
</style>
</head>
<body>
<header class="topbar">
 <button class="icon-btn" id="menu" aria-label="Ouvrir le sommaire">☰</button>
 <a class="brand" href="#accueil"><span class="logo">En</span><span>English for Data &amp; Translation<small>Grammaire · Anglais technique · Traduction</small></span></a>
 <nav class="top-nav" id="topnav">
  <a href="#accueil" data-r="accueil">Accueil</a>
  <a href="#programme" data-r="programme">Programme</a>
  <a href="#progression" data-r="progression">Ma progression</a>
  <a href="#glossaire" data-r="glossaire">Glossaire</a>
 </nav>
 <button class="icon-btn" id="theme" aria-label="Changer de thème" title="Thème clair / sombre">◐</button>
</header>
<div class="layout">
 <nav id="sidebar" aria-label="Sommaire"></nav>
 <main id="main"></main>
</div>
<div id="scrim"></div>
<script>
"use strict";
const CH = [];
const MODULES = [
  {id:1, title:"Le système verbal", sub:"Temps et aspects", color:"#0f6e85"},
  {id:2, title:"Le groupe nominal", sub:"Noms, articles, déterminants", color:"#2c7a4b"},
  {id:3, title:"Voix, modalité, hypothèse", sub:"Passif, modaux, conditionnels, -ing / to", color:"#a5581a"},
  {id:4, title:"La phrase complexe", sub:"Relatives, connecteurs, discours, comparaison", color:"#3f51b5"},
  {id:5, title:"L'anglais des données", sub:"Chiffres, statistique, outils, collocations", color:"#b03a63"},
  {id:6, title:"Traduction professionnelle", sub:"Faux amis, procédés, conventions, projet final", color:"#6d43a8"}
];
const H = t => `<h3>${t}</h3>`;
const P = t => `<p>${t}</p>`;
const L = a => `<ul>${a.map(x => `<li>${x}</li>`).join("")}</ul>`;
const E = (en, fr) => `<div class="ex"><p class="en">${en}</p>${fr ? `<p class="fr">${fr}</p>` : ""}</div>`;
const B = (k, h) => `<div class="box ${k}">${h}</div>`;
const T = (head, rows) => `<div class="tw"><table class="g"><thead><tr>${head.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const ZERO = ["0", "ø", "∅", "-", "zero", "zéro", "rien", "x"];

/* ===================== MODULE 1 : LE SYSTÈME VERBAL ===================== */

CH.push({id:1, m:1,
title:"Présent simple et présent continu",
grammar:"Present simple / present continuous, verbes d'état",
data:"Décrire un jeu de données, un tableau de bord, un traitement en cours",
trad:"Un seul présent en français, deux en anglais",
obj:[
 "Choisir entre présent simple (fait général, règle, procédure, description) et présent continu (action en cours, situation temporaire, évolution).",
 "Maîtriser la 3e personne du singulier (-s, -es, -ies) et les formes négatives et interrogatives avec <i>do / does</i>.",
 "Employer correctement les verbes d'état : <i>contain, include, consist of, depend on, mean, belong to</i>.",
 "Décrire un jeu de données et un tableau de bord avec les formules standard des rapports."
],
lesson:[
H("1. Le présent simple : faits, règles, descriptions"),
P("On l'emploie pour ce qui est vrai en général ou de façon durable : une définition, une règle de calcul, une procédure répétée, la description d'un document ou d'un outil. C'est le temps par défaut de la documentation technique et des sections descriptives d'un rapport."),
T(["Forme","Exemple"],[
 ["Affirmative","The script <b>runs</b> every night."],
 ["Négative","The script <b>does not (doesn't) run</b> on Sundays."],
 ["Interrogative","<b>Does</b> the script <b>run</b> automatically?"],
 ["Question ouverte","How often <b>does</b> the dashboard <b>refresh</b>?"]]),
P("À la 3e personne du singulier, on ajoute <b>-s</b>. Orthographe : <i>process → processes, fix → fixes</i> (après s, x, sh, ch, o : -es) ; <i>query → queries</i> (consonne + y → -ies) ; <i>display → displays</i> (voyelle + y : -s). Irréguliers : <i>have → has, do → does, go → goes</i>. Après <i>does / doesn't</i>, le verbe revient à la base verbale : <i>Does it <b>work</b>?</i> et jamais <s>Does it works?</s>"),
E("The dataset <b>contains</b> 12,450 records and 38 variables.","Le jeu de données contient 12 450 enregistrements et 38 variables."),

CH.push({id:10, m:3,
title:"Les modaux et l'art de nuancer",
grammar:"can, could, may, might, must, should, have to, need to ; modaux au passé ; hedging",

obj:[

H("1. Règles de forme"),

H("2. Capacité et possibilité"),
P("<b>can</b> : capacité, possibilité générale. <b>could</b> : capacité passée, possibilité. <b>be able to</b> : pour les temps que <i>can</i> n'a pas."),
E("Power BI <b>can</b> connect to SQL Server.","Power BI peut se connecter à SQL Server."),
E("Next year, we <b>will be able to</b> automate the report.","L'an prochain, nous pourrons automatiser le rapport."),
H("3. Degrés de certitude"),
T(["Certitude","Modal","Exemple"],[
 ["quasi certain (déduction)","must","The total is 112%: there <b>must</b> be an error."],
 ["attendu, normal","should","The refresh <b>should</b> take about five minutes."],
 ["possible","may","The difference <b>may</b> reflect seasonal effects."],
 ["possible, moins sûr","might / could","Low coverage <b>might</b> be due to stock-outs."],

H("4. Obligation, interdiction, conseil"),
T(["Sens","Forme","Exemple"],[

P("Attention : <i>mustn't</i> (interdit) et <i>don't have to</i> (pas obligatoire) ont des sens opposés."),
H("5. Modaux + have + participe passé"),
T(["Forme","Sens","Exemple"],[
 ["should have","reproche, regret","We <b>should have checked</b> the encoding."],
 ["must have","déduction sur le passé","The script <b>must have failed</b> during the night."],
 ["may / might / could have","possibilité passée","The file <b>might have been</b> overwritten."],
 ["can't / couldn't have","impossibilité passée","He <b>can't have deleted</b> it: he has no access."]]),
H("6. Nuancer (hedging)"),
P("En statistique, on évite les affirmations trop fortes, surtout avec des données observationnelles. Outils : <i>may, might, could, appear to, seem to, suggest, indicate, tend to, is likely to, to some extent, it is possible that</i>."),
T(["Trop affirmatif","Nuancé"],[
 ["This proves that training increased productivity.","These results <b>suggest that</b> training <b>may have</b> increased productivity."],
 ["The decrease is caused by the stock-out.","The decrease <b>is likely to be</b> related to the stock-out."],
 ["Rural women use services less.","Rural women <b>appear to</b> use services less often."]]),
B("trap",P("« Devoir » a plusieurs sens : <i>Il doit être en réunion</i> → <i>He <b>must</b> be in a meeting</i> (déduction) ; <i>Nous devons livrer vendredi</i> → <i>We <b>have to</b> deliver on Friday</i> ; <i>Le rapport devrait être prêt</i> → <i>The report <b>should</b> be ready</i> ; <i>Vous devriez vérifier</i> → <i>You <b>should</b> check</i>. « Il faut » → <i>we need to, it is necessary to, … must be…</i>")),
B("data",P("Section « Recommendations » type : <i>The programme <b>should</b> strengthen supportive supervision. Facilities <b>must</b> submit reports by the 5th of each month. Further research <b>is needed</b> to assess long-term effects.</i>")),
B("trad",P("Le conditionnel journalistique ou de prudence (« le taux serait de 12 % ») ne se traduit jamais par <i>would</i>. Utilisez <i>is estimated at, is reportedly, may be</i> : <i>The rate <b>is estimated at</b> 12%.</i>"))
].join(""),

vocab:[["to hedge","nuancer, atténuer"],["likely / unlikely","probable / improbable"],["to suggest","suggérer, indiquer"],["to reflect","refléter"],["further research","recherches complémentaires"],["to strengthen","renforcer"],["bias","biais"],["to rule out","exclure"],["reportedly","selon certaines sources"],["finding","résultat, constat"]],
ex:[

 {q:"The difference ___ be due to chance; the sample is small. (possibilité)", a:["may","might","could"], x:"Simple possibilité : <i>may / might / could</i>."},

]},

CH.push({id:11, m:3,
title:"Les conditionnelles et la logique",
grammar:"Conditionnels 0, 1, 2, 3 et mixtes ; unless, provided that, in case, whether ; wish",
data:"Logique IF (Excel, DAX, SQL CASE), scénarios, analyses de sensibilité",
trad:"« Si » + futur, imparfait ou plus-que-parfait",
obj:[
 "Maîtriser les quatre types de conditionnelles et les conditionnelles mixtes.",
 "Ne jamais employer <i>will</i> ou <i>would</i> dans la proposition en <i>if</i>.",
 "Utiliser <i>unless, provided that, as long as, in case, otherwise, whether</i>.",
 "Lire et expliquer en anglais une formule IF, SWITCH ou CASE WHEN."
],
lesson:[
H("1. Les quatre types"),
T(["Type","Structure","Emploi","Exemple"],[
 ["0","If + présent, présent","règle, vérité, comportement d'un système","If a cell <b>is</b> blank, Power BI <b>ignores</b> it in the average."],
 ["1","If + présent, will","condition réelle, futur probable","If the data <b>arrive</b> today, we <b>will finish</b> tomorrow."],
 ["2","If + prétérit, would","hypothèse sur le présent ou l'avenir, irréel","If we <b>had</b> more enumerators, we <b>would finish</b> faster."],
 ["3","If + past perfect, would have + participe","passé irréel, regret","If we <b>had tested</b> the form, we <b>would have avoided</b> these errors."],
 ["mixte","If + past perfect, would + base","cause passée, conséquence présente","If we <b>had hired</b> a data manager last year, we <b>would be</b> in a better position now."]]),
P("Au type 2, <i>were</i> est recommandé à toutes les personnes dans un style soigné : <i>If I <b>were</b> you…</i>, <i>If the sample <b>were</b> larger…</i>"),
H("2. La règle d'or"),
P("Pas de <i>will</i> ni de <i>would</i> après <i>if</i> : <s>If it will rain</s>, <s>If I would have known</s>. Seule exception, la politesse : <i>If you <b>would</b> like to join us…</i>"),
H("3. Les autres conjonctions de condition"),
T(["Conjonction","Sens","Exemple"],[
 ["unless","à moins que, si… ne… pas","We won't publish <b>unless</b> the director approves."],
 ["provided (that), providing, as long as","à condition que","You can access the report <b>as long as</b> you use your organisation account."],
 ["in case","au cas où (précaution)","Keep a copy of the raw data <b>in case</b> something goes wrong."],
 ["otherwise","sinon","Save your work; <b>otherwise</b>, you will lose your changes."],
 ["even if","même si","<b>Even if</b> the response rate is low, the estimate remains valid."],
 ["whether (or not)","si (alternative, question indirecte)","Check <b>whether</b> the file contains a header row."]]),
P("Style formel par inversion : <i><b>Should</b> you need further information, please contact us.</i> (= If you need) ; <i><b>Had</b> we known, we would have acted.</i> (= If we had known) ; <i><b>Were</b> the sample larger, …</i>"),
H("4. wish et if only"),
P("<i>I wish</i> + prétérit (regret sur le présent) : <i>I wish we <b>had</b> more time.</i> <i>I wish</i> + past perfect (regret sur le passé) : <i>I wish we <b>had kept</b> the raw data.</i>"),
H("5. Lire une formule conditionnelle en anglais"),
P("Les outils de données parlent la langue des conditionnelles de type 0 : <i>returns, evaluates, otherwise</i>."),
T(["Outil","Formule","Lecture en anglais"],[
 ["Excel","<code>=IF(B2&gt;=0.8,\"On track\",\"At risk\")</code>","If B2 is greater than or equal to 0.8, the formula returns “On track”; otherwise, it returns “At risk”."],
 ["DAX","<code>Status = IF([Coverage] &gt;= 0.8, \"On track\", \"At risk\")</code>","The measure returns “On track” when coverage reaches 80% or more."],
 ["SQL","<code>CASE WHEN score &lt; 50 THEN 'Low' ELSE 'OK' END</code>","When the score is below 50, the expression returns “Low”; in all other cases, it returns “OK”."]]),
B("trap",P("<i>Si j'avais su</i> → <i>If I <b>had known</b></i>, jamais <s>If I would have known</s>. Et le « si » interrogatif (« vérifiez si ») se traduit par <i>whether</i> ou <i>if</i>, jamais par une conditionnelle.")),
B("data",P("Analyse de sensibilité : <i>If the response rate <b>were</b> 10 points lower, the estimate <b>would change</b> by less than 1%. If we <b>had excluded</b> the outliers, the coefficient <b>would have been</b> 0.28.</i>")),
B("trad",P("« Si » + présent → type 1 ; « si » + imparfait → type 2 ; « si » + plus-que-parfait → type 3. « On aurait dû » → <i>we should have</i> (chapitre 10) ; « à défaut, sinon » → <i>otherwise</i>."))
].join(""),
task:"Écrivez trois formules (Excel, DAX ou SQL) utilisant IF, SWITCH ou CASE tirées de votre travail, puis expliquez chacune en une phrase anglaise. Ajoutez une analyse de sensibilité de 60 mots avec des conditionnelles de type 2 et 3.",
vocab:[["sensitivity analysis","analyse de sensibilité"],["scenario","scénario"],["to return (a value)","renvoyer (une valeur)"],["otherwise","sinon"],["blank","vide"],["on track","en bonne voie"],["at risk","à risque"],["to hire","recruter"],["provided that","à condition que"],["whether","si (interrogation indirecte)"]],
ex:[
{t:"gap", title:"Conditionnelles", instr:"Complétez avec la forme correcte.", items:[
 {q:"If the cell ___ (be) empty, the formula returns 0.", a:["is"], x:"Type 0 : règle d'un système, présent dans les deux propositions."},
 {q:"If we ___ (receive) the budget, we will hire two data clerks.", a:["receive"], x:"Type 1 : présent après <i>if</i>."},
 {q:"If I ___ (be) you, I would use Power Query instead of VBA.", a:["were","was"], x:"Type 2 : <i>were</i> recommandé dans un style soigné."},
 {q:"If we had validated the form, we ___ (not / lose) so much data.", a:["would not have lost","wouldn't have lost"], x:"Type 3 : <i>would have + participe</i>."},
 {q:"We won't publish the dashboard ___ the director approves it. (à moins que)", a:["unless"], x:"<i>Unless</i> = <i>if… not</i>."},
 {q:"Keep a copy of the raw data ___ something goes wrong. (au cas où)", a:["in case"], x:"Précaution : <i>in case</i>."},
 {q:"Please check ___ the file contains a header row. (si, interrogation indirecte)", a:["whether","if"], x:"Question indirecte : <i>whether</i> (ou <i>if</i>)."}
]},
{t:"mcq", title:"Hypothèses et formules", instr:"Choisissez la forme correcte.", items:[
 {q:"If the server ___ down again, call the IT team.", o:["will go","goes","would go"], a:1, x:"Pas de <i>will</i> après <i>if</i>."},
 {q:"If we had more data, the model ___ more accurate.", o:["will be","would be","would have been"], a:1, x:"Type 2 : <i>would + base verbale</i>."},
 {q:"If you had told me earlier, I ___ the deadline.", o:["would change","would have changed","had changed"], a:1, x:"Type 3."},
 {q:"You can access the report ___ you use your organisation account.", o:["unless","as long as","otherwise"], a:1, x:"Condition nécessaire : <i>as long as</i>."},
 {q:"(Formel) ___ you need further information, please contact us.", o:["Should","Would","Will"], a:0, x:"Inversion avec <i>should</i> = <i>if you need</i>."},
 {q:"Lecture correcte de <code>IF([Stock] &lt; [Min], \"Reorder\", \"OK\")</code> :", o:["If stock is below the minimum, it returns “Reorder”; otherwise, it returns “OK”.","If stock would be lower than the minimum, it would return “Reorder”.","When stock will be under the minimum, it returns “Reorder”."], a:0, x:"Type 0 au présent, avec <i>otherwise</i>."}
]},
{t:"tr", title:"Traduction", instr:"Identifiez le type de conditionnelle avant de traduire.", items:[
 {d:"fr-en", q:"Si le taux de réponse est inférieur à 80 %, nous prolongerons la collecte d'une semaine.", a:"If the response rate is below 80%, we will extend data collection by one week.", x:"Type 1. « Prolonger de » → <i>extend by</i>."},
 {d:"fr-en", q:"Si nous avions automatisé ce rapport, nous aurions gagné des heures chaque mois.", a:"If we had automated this report, we would have saved hours every month.", x:"Type 3. « Gagner du temps » → <i>save time</i>."},
 {d:"fr-en", q:"La mesure renvoie « Hors cible » si la valeur est inférieure à 50 ; sinon, elle renvoie « Conforme ».", a:"The measure returns “Off target” if the value is below 50; otherwise, it returns “On target”.", x:"Type 0 pour décrire un comportement. Les libellés se traduisent s'ils apparaissent dans un rapport en anglais."},
 {d:"en-fr", q:"Unless the data are cleaned by Friday, the analysis will be postponed.", a:"Si les données ne sont pas nettoyées d'ici vendredi, l'analyse sera reportée.", x:"<i>Unless</i> se rend souvent mieux par « si… ne… pas » que par « à moins que », plus lourd."}

CH.push({id:12, m:3,

    $("#done").addEventListener("click", () => {
      st.done = !st.done; save();
      const b = $("#done"); b.className = "btn " + (st.done ? "ok" : "primary");
      b.textContent = st.done ? "✓ Chapitre terminé" : "Marquer le chapitre comme terminé";
      renderSide(c.id);
    });
    $("#reset").addEventListener("click", () => {
      if (confirm("Effacer vos réponses et scores pour ce chapitre ? Votre texte de production personnelle est conservé.")) { st.res = {}; st.ans = {}; save(); viewCh(c.id); }
    });
  }

  /* ---------- delegated events ---------- */
  main.addEventListener("click", ev => {
    if (!cur) return;
    const opt = ev.target.closest(".opt");
    if (opt) { markMcq(opt.dataset.k, +opt.dataset.n); save(); updateScore(); return; }
    const b = ev.target.closest("[data-act]");
    if (!b) return;
    const a = b.dataset.act;
    if (a === "check") {
      b.closest(".exo").querySelectorAll("input.gap").forEach(inp => markGap(inp.dataset.k));
      save(); updateScore();
    } else if (a === "sol") {
      const ex = b.closest(".exo"); const show = !ex.classList.contains("show-sol");
      ex.classList.toggle("show-sol", show);
      ex.querySelectorAll(".sol").forEach(s => { s.hidden = !show; });
      b.textContent = show ? "Masquer le corrigé" : "Afficher le corrigé";
    } else if (a === "show") {
      reveal(b.dataset.k);
    } else if (a === "self") {
      const v = +b.dataset.v; cs(cur.id).res[b.dataset.k] = v; markSelf(b.dataset.k, v); save(); updateScore();
    }
  });
  main.addEventListener("input", ev => {
    if (!cur) return;
    const t = ev.target;
    if (t.matches("input.gap, textarea.tr")) { cs(cur.id).ans[t.dataset.k] = t.value; save(); }
    else if (t.id === "notes") { cs(cur.id).notes = t.value; save(); }
  });
  main.addEventListener("keydown", ev => {
    if (cur && ev.key === "Enter" && ev.target.matches("input.gap")) { ev.preventDefault(); markGap(ev.target.dataset.k); save(); updateScore(); }
  });

  /* ---------- router ---------- */
  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    const m = h.match(/^ch\/(\d+)$/);
    cur = null;
    if (m) { const id = +m[1]; renderSide(id); viewCh(id); }
    else if (h === "programme") { renderSide("programme"); viewPlan(); }
    else if (h === "progression") { renderSide("progression"); viewProgress(); }
    else if (h === "glossaire") { renderSide("glossaire"); viewGloss(); }
    else { renderSide("accueil"); viewHome(); }
    document.body.classList.remove("nav-open");
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
